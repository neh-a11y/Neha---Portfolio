<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neha Lakshmanan · Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#f1e6d6; --wall2:#e7d6bf; --trim:#cdb393; --floor:#7a4f33; --floor2:#6b432a;
    --ink:#2a2230; --muted:#6c6170; --paper:#fffaf2;
    --dh:320px; --dw:160px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--wall);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
  button{font:inherit;cursor:pointer}

  /* ---------- Stage ---------- */
  #stage{position:fixed;inset:0;overflow:hidden}
  #world{position:absolute;top:0;left:0;height:100%;will-change:transform;transition-property:transform;transition-timing-function:cubic-bezier(.45,.05,.4,1)}
  .wall{position:absolute;top:0;left:0;height:100%;
    background:
      linear-gradient(to bottom, transparent calc(78% - var(--dh)*0.42), var(--trim) calc(78% - var(--dh)*0.42), var(--trim) calc(78% - var(--dh)*0.42 + 6px), var(--wall2) calc(78% - var(--dh)*0.42 + 6px)),
      repeating-linear-gradient(90deg, rgba(0,0,0,.018) 0 2px, transparent 2px 46px),
      var(--wall);}
  .floor{position:absolute;left:0;bottom:0;height:22%;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.35), transparent 18%),
      repeating-linear-gradient(90deg, var(--floor) 0 118px, var(--floor2) 118px 120px),
      var(--floor);}
  .floor::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#4f321f}

  .lamp{position:absolute;bottom:calc(22% + var(--dh) + 26px);width:26px;height:34px;transform:translateX(-50%)}
  .lamp::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:26px;height:22px;border-radius:13px 13px 4px 4px;background:#e9b44c;box-shadow:0 0 50px 26px rgba(255,203,110,.35)}
  .lamp::after{content:"";position:absolute;left:50%;top:22px;transform:translateX(-50%);width:6px;height:12px;background:#5a4636;border-radius:2px}
  .frame-art{position:absolute;bottom:calc(22% + var(--dh)*0.55);width:calc(var(--dw)*.62);height:calc(var(--dw)*.48);transform:translateX(-50%);border:7px solid #8b6a4a;background:linear-gradient(160deg,#cfe0d6,#e8c9a5 60%,#b9846a);box-shadow:0 6px 14px rgba(0,0,0,.15)}
  .frame-art.alt{background:linear-gradient(200deg,#d9c3e0,#f2dcc0 55%,#8fb3b0)}

  /* ---------- Doors ---------- */
  .door{position:absolute;bottom:22%;width:var(--dw);height:var(--dh);transform:translateX(-50%);cursor:pointer}
  .door .casing{position:absolute;inset:-14px -14px 0 -14px;background:#fbf5ec;border-radius:6px 6px 0 0;box-shadow:inset 0 0 0 3px #d8c3a6, 0 4px 12px rgba(0,0,0,.12)}
  .door .inside{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 60%, #fff3cf 0%, #ffd98a 35%, #c98a3c 80%, #5a3a1c 100%)}
  .door .inside::before{content:"";position:absolute;left:12%;right:12%;top:18%;height:3px;background:rgba(90,58,28,.35);box-shadow:0 26px 0 rgba(90,58,28,.3)}
  .door .inside .glimpse{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700;color:rgba(90,58,28,.55);font-size:calc(var(--dw)*.18);text-align:center;padding:10px}
  .door .hinge{position:absolute;inset:0;perspective:1100px;perspective-origin:0% 50%}
  .door .leaf{position:absolute;inset:0;transform-origin:left center;transition:transform 1.1s cubic-bezier(.3,.1,.2,1);transform-style:preserve-3d;
    background:var(--c);border-radius:3px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
  .door .leaf::before,.door .leaf::after{content:"";pointer-events:none;position:absolute;left:14%;right:14%;border-radius:3px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14), inset 0 0 0 7px rgba(255,255,255,.08)}
  .door .leaf::before{top:8%;height:38%}
  .door .leaf::after{top:52%;height:40%}
  .door .knob{position:absolute;right:11%;top:52%;width:calc(var(--dw)*.09);height:calc(var(--dw)*.09);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c9,#d6a63a 55%,#8a6418);z-index:2}
  .door .plate{position:absolute;left:50%;top:-12px;transform:translate(-50%,-100%);background:#2a2230;color:#f8ead0;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:4px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.2)}
  .door .num{position:absolute;left:50%;top:21%;transform:translateX(-50%);font-family:Fraunces,serif;font-weight:700;color:#f6e3b8;font-size:calc(var(--dw)*.2);z-index:2;text-shadow:0 1px 0 rgba(0,0,0,.25)}
  .door .mat{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);width:120%;height:12px;border-radius:3px;background:#a0472f;opacity:.85}
  .door .spill{position:absolute;left:-10%;right:-60%;bottom:-60px;height:60px;background:radial-gradient(ellipse at 30% 0%, rgba(255,210,120,.65), transparent 70%);opacity:0;transition:opacity .9s .3s}
  .door.open .leaf{transform:rotateY(-104deg)}
  .door.open .spill{opacity:1}
  .door.shake .leaf{animation:shake .5s 2}
  @keyframes shake{0%,100%{translate:0}25%{translate:2px 0}50%{translate:-1px 0}75%{translate:2px 0}}
  .door:hover .leaf{filter:brightness(1.07)}

  .knock-txt{position:absolute;left:30%;font-family:Fraunces,serif;font-weight:700;font-style:italic;color:var(--ink);font-size:20px;opacity:0;pointer-events:none;white-space:nowrap}
  .knock-txt.go{animation:pop 1s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.8)}25%{opacity:1;transform:translateY(0) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translateY(-22px) scale(1)}}

  /* ---------- Character ---------- */
  #neha{position:absolute;bottom:calc(22% - 4px);height:calc(var(--dh)*.74);transition:left .5s;z-index:5;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
  #neha svg{height:100%;overflow:visible;transform-origin:50% 100%}
  #neha .legF,#neha .legB,#neha .armF,#neha .armB{transform-box:fill-box;transform-origin:50% 4%}
  #neha.walking .legF{animation:liftA .56s infinite ease-in-out}
  #neha.walking .legB{animation:liftB .56s infinite ease-in-out}
    #neha.walking .armF{animation:swing .56s infinite ease-in-out}
  #neha.walking svg{animation:sway .56s infinite ease-in-out}
  #neha.walking .bod{animation:bob .28s infinite alternate ease-in-out}
  @keyframes stepA{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
  @keyframes stepB{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
  @keyframes liftA{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.86)}}
  @keyframes liftB{0%,100%{transform:scaleY(.86)}50%{transform:scaleY(1)}}
  @keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
  @keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
  @keyframes bob{to{transform:translateY(-2px)}}

  #neha.knocking .armF{animation:knock 1.15s ease-in-out}
  @keyframes knock{0%{transform:rotate(0)}20%{transform:rotate(-82deg)}34%{transform:rotate(-66deg)}48%{transform:rotate(-82deg)}62%{transform:rotate(-66deg)}76%{transform:rotate(-82deg)}100%{transform:rotate(0)}}
  #neha.waving .armF{animation:wave 1.2s ease-in-out}
  @keyframes wave{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-150deg)}50%{transform:rotate(-125deg)}}
  .bubble{position:absolute;left:55%;bottom:100%;margin-bottom:8px;background:#fff;color:var(--ink);padding:8px 12px;border-radius:14px 14px 14px 4px;font-size:14px;font-weight:500;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.14);opacity:0;transform:translateY(6px);transition:.3s;pointer-events:none}
  .bubble.show{opacity:1;transform:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:10px;z-index:20;pointer-events:none}
  #hud > *{pointer-events:auto}
  .dots{display:flex;gap:6px;background:rgba(42,34,48,.82);backdrop-filter:blur(6px);padding:6px;border-radius:999px}
  .dots button{border:0;background:transparent;color:#e9dcc7;padding:7px 11px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
  .dots button.on{background:#f6e3b8;color:var(--ink)}
  .dots button:disabled{opacity:.5;cursor:default}
  .dots button .n{opacity:.7;margin-right:4px;font-variant-numeric:tabular-nums}
  #nextBtn{white-space:nowrap;border:0;background:#e9b44c;color:var(--ink);font-weight:700;padding:12px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  #nextBtn:disabled{opacity:.5;cursor:default}
  #brand{position:fixed;top:16px;left:20px;z-index:20;font-family:Fraunces,serif;font-weight:700;font-size:18px}
  #brand small{display:block;font-family:"DM Sans";font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  #counter{position:fixed;top:20px;right:20px;z-index:20;font-size:13px;color:var(--muted);font-weight:500}

  /* ---------- Intro ---------- */
  #intro{position:fixed;inset:0;z-index:40;display:flex;background:radial-gradient(ellipse at 50% 30%, #fff0d2, #f1e6d6 70%);overflow:auto;transition:opacity .7s, visibility .7s;padding:24px;text-align:center}
  #intro.gone{opacity:0;visibility:hidden}
  #intro > div{margin:auto}
  #intro .kicker{letter-spacing:.2em;text-transform:uppercase;font-size:12px;font-weight:700;color:#a0472f}
  #intro h1{font-family:Fraunces,serif;font-size:clamp(34px,7vw,78px);line-height:1;margin:14px 0 10px}
  #intro p{color:var(--muted);font-size:clamp(16px,2vw,19px);max-width:520px;margin:0 auto 28px;line-height:1.5}
  #intro button{border:0;background:var(--ink);color:#f8ead0;font-weight:700;font-size:17px;padding:15px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(42,34,48,.25)}
  #intro button:hover{transform:translateY(-1px)}
  #intro .hint{margin-top:16px;font-size:13px;color:var(--muted)}
  .hint-touch{display:none}
  @media (max-height:520px){
    #intro .avatar{width:76px;height:76px;border-width:3px}
    #intro h1{font-size:clamp(28px,6vw,44px);margin:8px 0 6px}
    #intro p{margin-bottom:14px;font-size:15px}
    #intro button{padding:12px 22px;font-size:15px}
    .door .knock-txt{left:108% !important;font-size:17px}
    .door .knock-txt.k1{top:8% !important}
    .door .knock-txt.k2{top:22% !important}
    #brand{font-size:15px;top:10px}
  }
  @media (hover:none),(max-width:700px){.hint-touch{display:inline}.hint-desk{display:none}}
  body.intro-on #stage,body.intro-on #hud,body.intro-on #brand,body.intro-on #counter{visibility:hidden}

  .avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 10px 28px rgba(42,34,48,.22);display:block;margin:0 auto 6px}
  .hello-row{display:flex;gap:22px;align-items:center}
  .hello-row img{width:130px;height:130px;border-radius:50%;object-fit:cover;flex:none;border:4px solid #fff;box-shadow:0 6px 18px rgba(42,34,48,.18)}
  @media (max-width:560px){.hello-row{flex-direction:column;align-items:flex-start}.hello-row img{width:96px;height:96px}}
  /* ---------- Room card ---------- */
  #room{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(42,34,48,.35);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .4s, visibility .4s}
  #room.show{opacity:1;visibility:visible}
  .card{position:relative;width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--paper);border-radius:18px;box-shadow:0 30px 80px rgba(42,34,48,.35);transform:scale(.55) translateY(40px);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.25,1.15), opacity .35s;border-top:10px solid var(--c,#2f5d62)}
  #room.show .card{transform:none;opacity:1}
  .card-head{padding:28px 32px 6px;display:flex;align-items:baseline;gap:14px}
  .card-head .big{font-family:Fraunces,serif;font-size:56px;font-weight:700;color:var(--c);line-height:.8}
  .card-head .lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .card-head h2{font-family:Fraunces,serif;font-size:clamp(26px,3.6vw,36px);margin:4px 0 0;line-height:1.1}
  .card-body{padding:8px 32px 8px;line-height:1.6;font-size:16px}
  .card-body p{margin:.6em 0}
  .card-body h3{font-size:17px;margin:20px 0 2px}
  .card-body .meta{color:var(--muted);font-size:14px;margin:0 0 6px}
  .card-body ul{padding-left:20px;margin:.4em 0}
  .card-body li{margin:.3em 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
  .tile{background:#fff;border:1px solid #eadfcd;border-radius:12px;padding:14px 16px}
  .tile b{display:block;margin-bottom:4px}
  .tile span{color:var(--muted);font-size:14px;line-height:1.45;display:block}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
  .chips span{background:#fff;border:1px solid #e3d5bf;border-radius:999px;padding:4px 11px;font-size:13.5px}
  .roles{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
  .roles div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #eadfcd;border-radius:10px;padding:10px 14px}
  .roles div span{color:var(--muted);font-size:14px}
  .contact a{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid #eadfcd;border-radius:12px;padding:14px 16px;margin:10px 0;font-weight:500}
  .contact a:hover{border-color:var(--c)}
  .contact a small{color:var(--muted);font-weight:400}
  .card-foot{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:10px;padding:16px 32px 22px;background:linear-gradient(to top,var(--paper) 75%,rgba(255,250,242,0))}
  .card-foot button{border:0;border-radius:999px;padding:11px 18px;font-weight:700}
  .btn-ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px #dccbb1}
  .btn-main{background:var(--c);color:#fff}
  .xbtn{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:#f0e5d4;font-size:20px;line-height:1;color:var(--ink)}

  @media (max-width:700px){
    .dots button .t{display:none}
    .dots button .n{margin:0;opacity:1}
    .card-head{padding:24px 20px 4px}.card-head .big{font-size:42px}
    .card-body{padding:6px 20px}.card-foot{padding:14px 20px 18px}
    #counter{display:none}
    #hud{gap:6px;padding-left:8px;padding-right:8px}
    .dots{gap:0;padding:4px}.dots button{padding:7px 8px}
    #nextBtn{padding:11px 14px;font-size:14px}
    .card-foot button{font-size:14px;padding:10px 14px}
    #room{padding:10px;align-items:end}
    .card{max-height:calc(100vh - 20px)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>

const $ = s => document.querySelector(s);
const world = $("#world"), neha = $("#neha"), bubble = $("#bubble");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
let G = {}, cur = -1, busy = false, tx = 0;
const doors = [];

function layout(){
  const W = innerWidth, H = innerHeight;
  const dh = Math.max(180, Math.min(H*0.46, 330, W*0.62)), dw = dh*0.5;
  const spacing = dw + Math.max(170, Math.min(W*0.5, 430));
  const pad = W;
  document.documentElement.style.setProperty("--dh", dh+"px");
  document.documentElement.style.setProperty("--dw", dw+"px");
  const charH = dh*0.74, charW = charH*0.5;
  const doorCx = Math.max(W/2 + Math.min(70, W*0.08), charW*0.95 + dw/2 + 30);
  G = {W,H,dh,dw,spacing,pad,charW,doorCx};
  const total = pad*2 + spacing*(ROOMS.length-1);
  world.style.width = total+"px";
  world.querySelectorAll(".wall,.floor").forEach(e=>e.style.width=total+"px");
  doors.forEach((d,i)=> d.style.left = doorX(i)+"px");
  world.querySelectorAll("[data-mid]").forEach(e=> e.style.left = (doorX(+e.dataset.mid)+spacing/2)+"px");
  world.querySelectorAll("[data-pre]").forEach(e=> e.style.left = (doorX(0)-spacing*(+e.dataset.pre))+"px");
  neha.style.left = (doorCx - dw/2 - 14 - charW*0.95)+"px";
  setTx(targetTx(cur < 0 ? -1 : cur), 0);
}
const doorX = i => G.pad + i*G.spacing;
const targetTx = i => G.doorCx - (i < 0 ? doorX(0) - G.spacing*0.9 : doorX(i));
function setTx(v, ms){ world.style.transitionDuration = ms+"ms"; world.style.transform = `translateX(${v}px)`; tx = v; }

function build(){
  ROOMS.forEach((r,i)=>{
    const d = document.createElement("div");
    d.className = "door"; d.style.setProperty("--c", r.color);
    d.setAttribute("role","button"); d.setAttribute("tabindex","0"); d.setAttribute("aria-label",`Door ${i+1}: ${r.label}`);
    d.innerHTML = `<div class="casing"></div><div class="inside"><div class="glimpse">${r.glimpse}</div></div>
      <div class="hinge"><div class="leaf"><div class="num">${String(i+1).padStart(2,"0")}</div><div class="knob"></div></div></div><div class="plate">${r.label}</div><div class="mat"></div><div class="spill"></div>
      <div class="knock-txt k1" style="top:-112px">knock</div><div class="knock-txt k2" style="top:-82px;left:55%">knock!</div>`;
    d.addEventListener("click", ()=> go(i));
    d.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go(i);} });
    world.appendChild(d); doors.push(d);
    if(i < ROOMS.length-1){
      const l = document.createElement("div"); l.className = "lamp"; l.dataset.mid = i; world.appendChild(l);
    }
  });
  [1,2].forEach(k=>{ const a=document.createElement("div"); a.className="frame-art"+(k===2?" alt":""); a.dataset.pre=k*0.55+0.1; world.appendChild(a); });
  const lastArt = document.createElement("div"); lastArt.className="frame-art alt"; lastArt.dataset.mid = ROOMS.length-1; world.appendChild(lastArt);

  const dots = $("#dots");
  ROOMS.forEach((r,i)=>{
    const b = document.createElement("button");
    b.innerHTML = `<span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${r.label}</span>`;
    b.addEventListener("click", ()=> go(i));
    dots.appendChild(b);
  });
}

function say(t, ms=1400){ bubble.textContent = t; bubble.classList.add("show"); clearTimeout(say.t); say.t = setTimeout(()=>bubble.classList.remove("show"), reduced?ms:ms); }

async function walkTo(i){
  const to = targetTx(i), dist = Math.abs(to - tx);
  if(dist < 2) return;
  const ms = Math.min(2600, 500 + dist*1.7);
  neha.classList.add("walking");
  setTx(to, reduced ? 0 : ms);
  await wait(ms);
  neha.classList.remove("walking");
}

async function go(i){
  if(busy || i < 0 || i >= ROOMS.length) return;
  busy = true; updateHud(true);
  closeRoom();
  await wait(250);
  await walkTo(i);
  cur = i; updateHud(true);
  const d = doors[i];
  if(!d.classList.contains("open")){
    neha.classList.add("knocking"); d.classList.add("shake");
    d.querySelectorAll(".knock-txt").forEach((k,n)=> setTimeout(()=>k.classList.add("go"), reduced?0:n*380+150));
    await wait(1200);
    neha.classList.remove("knocking"); d.classList.remove("shake");
    d.querySelectorAll(".knock-txt").forEach(k=>k.classList.remove("go"));
    d.classList.add("open");
    await wait(900);
  } else {
    await wait(150);
  }
  openRoom(i);
  busy = false; updateHud();
}

function openRoom(i){
  const r = ROOMS[i];
  const card = $("#card"); card.style.setProperty("--c", r.color);
  $("#roomNum").textContent = String(i+1).padStart(2,"0");
  $("#roomLbl").textContent = `Door ${i+1} of ${ROOMS.length} · ${r.label}`;
  $("#roomTitle").textContent = r.title;
  $("#roomBody").innerHTML = r.html;
  $("#prevBtn").style.visibility = i === 0 ? "hidden" : "visible";
  $("#next2Btn").textContent = i === ROOMS.length-1 ? "Walk back to the start ↺" : `Next door: ${ROOMS[i+1].label} →`;
  card.scrollTop = 0;
  $("#room").classList.add("show");
  setTimeout(()=>$("#next2Btn").focus({preventScroll:true}), 350);
}
function closeRoom(){ $("#room").classList.remove("show"); }

function updateHud(lock){
  [...$("#dots").children].forEach((b,i)=>{ b.classList.toggle("on", i===cur); b.disabled = !!lock; });
  const nb = $("#nextBtn");
  nb.disabled = !!lock;
  nb.textContent = cur < 0 ? "Knock on door 1 →" : cur >= ROOMS.length-1 ? "Back to door 1 ↺" : "Next door →";
  $("#counter").textContent = cur < 0 ? "" : `Door ${cur+1} of ${ROOMS.length}`;
}
function next(){ go(cur >= ROOMS.length-1 ? 0 : cur+1); }

$("#nextBtn").addEventListener("click", next);
$("#next2Btn").addEventListener("click", next);
$("#prevBtn").addEventListener("click", ()=> go(cur-1));
$("#xBtn").addEventListener("click", ()=>{ closeRoom(); say("Pick any door, or tap Next."); });
$("#room").addEventListener("click", e=>{ if(e.target.id==="room") closeRoom(); });
$("#startBtn").addEventListener("click", async ()=>{
  document.body.classList.remove("intro-on");
  $("#intro").classList.add("gone");
  await wait(500);
  neha.classList.add("waving"); say("Hi! Let's go see what's behind door 1.", 1800);
  await wait(1500); neha.classList.remove("waving");
  go(0);
});
addEventListener("keydown", e=>{
  if($("#intro").classList.contains("gone") === false) { if(e.key==="Enter") $("#startBtn").click(); return; }
  if(e.key==="ArrowRight") next();
  else if(e.key==="ArrowLeft") go(cur-1);
  else if(e.key==="Escape") closeRoom();
});
addEventListener("resize", ()=> layout());

build(); layout(); updateHud();
</script>
</body>
</html>
